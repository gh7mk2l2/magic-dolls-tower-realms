[workspace]
members = ["crates/shared", "crates/sim", "crates/sim-wasm", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
shared = { path = "crates/shared" }
sim = { path = "crates/sim" }

[profile.release]
lto = "thin"
codegen-units = 4

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
