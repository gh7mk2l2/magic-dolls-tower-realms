# 《魔法玩偶：塔域战争》数值配置表
# 服务端启动时加载（路径可用环境变量 GAME_CONFIG 覆盖）；单机 WASM 模拟内置同一份文件。
# 时间单位均为秒，距离单位为世界像素，tick 频率固定 20Hz。

[world]
width = 3200.0
height = 1800.0
grid = 64                    # 流场网格边长（64x64）
match_seconds = 900          # 常规时限：15 分钟
# 复活时间按队伍累计翻倍：每队各自计数（每局清零），该队第 n 次有玩偶阵亡，
# 该玩偶复活时间 = respawn_base_secs * respawn_multiplier^(n-1) 秒（默认 1、2、4、8…）。
# 饱和运算，不会溢出；base 设为 0 即"立即复活"。
respawn_base_secs = 1
respawn_multiplier = 2
# 可选：单次复活时间上限（秒）。0 = 不设上限（当前规则）；设为 N 则复活时间 = min(上面的翻倍值, N)。
respawn_max_secs = 0
ai_fill_to = 4               # 每队人数不足时由 AI 魔法玩偶补足到该数量
max_team_size = 4

[base]
hp = 4200.0
radius = 90.0
offset_x = 180.0             # 距离各自地图边缘
damage = 140.0               # 基地防御魔晶：保护出生点，防止复活被蹲
range = 400.0
attack_seconds = 1.0

[tower]
hp = 2400.0
radius = 52.0
damage = 85.0
range = 310.0
attack_seconds = 1.2
offset_x = 720.0             # 距离各自地图边缘
lane_offset_y = 470.0        # 上下两座塔距地图中线的偏移

[poison]                     # 魔力辐射毒区
radius = 250.0
dps = 32.0                   # 每秒结算一次
hurts_allies = false         # 只伤害敌方魔法玩偶
hurts_minions = false

[wave]                       # 变异魔兽兵波
interval_seconds = 30
count_per_tower = 3
first_wave_seconds = 2
aggro_range = 220.0          # 发现敌人后脱离流场主动接战
hp = 180.0
damage = 24.0
speed = 95.0
radius = 17.0
range = 45.0
attack_seconds = 1.0
# 波次成长：倍率 = min(1 + 波次 * growth, max_multiplier)
hp_growth = 0.09
damage_growth = 0.07
speed_growth = 0.018
max_multiplier = 3.0
# 可选：显式波次曲线（第 n 项为第 n 波的生命倍率），填写后覆盖 hp_growth。
hp_curve = []

[sudden_death]               # 超时死斗：超级双头变异魔兽
hp = 18000.0
damage = 360.0
speed = 130.0
radius = 55.0
range = 110.0
attack_seconds = 0.8
per_tower = 1                # 每座存活魔法塔孕育的数量（无塔时从基地前出发）
respawn_seconds = 45         # 死斗中被击杀后重新孕育
max_seconds = 240            # 死斗最长时长，超时按基地剩余血量百分比判胜（相同为平局）
base_decay_per_second = 0.0  # 死斗期间基地每秒额外流失（0 关闭）

[hero]
hp = 720.0
speed = 255.0
radius = 24.0
attack_damage = 52.0
attack_range = 270.0
attack_seconds = 0.65
ai_aggro_range = 900.0

# ---- 魔法玩偶与技能 ----
# effect 可选：damage（范围伤害）、stun（范围伤害+眩晕）、slow（范围伤害+减速）、
#             dash（向瞄准方向位移，damage>0 时落点范围伤害）、heal（范围治疗友方，amount 为最大生命比例）、
#             nova（以自身为中心的范围伤害）、
#             chain（连锁闪电：命中落点附近敌人后在 radius 内弹射 count 次，每跳伤害 ×amount）、
#             summon（在落点召唤 count 个随从：summon_hp / summon_speed（0=炮台）/ summon_range，damage 为随从攻击，持续 duration_seconds）、
#             shield（自身 radius 内友方获得 amount×最大生命护盾，持续 duration_seconds）、
#             cloud（落点留下 radius 的持续区域，每秒 damage，持续 duration_seconds；amount>0 附带减速）、
#             pull（落点 radius 内敌人被拉向自己 amount 像素，造成 damage 并眩晕 duration_seconds）、
#             haste（自身 radius 内友方移速 +amount，持续 duration_seconds）、
#             regen（自身 radius 内友方在 duration_seconds 内回复 amount×最大生命）、
#             fortify（自身减伤 amount，持续 duration_seconds；radius>0 时嘲讽范围内敌人同样时长）、
#             stealth（隐身 duration_seconds，敌方无法选中，移速 +amount；普攻/施放其他技能即现身）
# 每个英雄 3 个技能，依次绑定 Q / E / R。

