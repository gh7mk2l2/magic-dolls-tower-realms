# 《魔法玩偶：塔域战争》数值配置表
# 服务端启动时加载（路径可用环境变量 GAME_CONFIG 覆盖）；单机 WASM 模拟内置同一份文件。
# 时间单位均为秒，距离单位为世界像素，tick 频率固定 20Hz。

[world]
width = 3200.0
height = 1800.0
grid = 64                    # 流场网格边长（64x64）
match_seconds = 900          # 常规时限：15 分钟
respawn_seconds = 3          # 死亡后复活倒计时（"立即复活"可设为 0）
ai_fill_to = 2               # 每队人数不足时由 AI 魔法玩偶补足到该数量
max_team_size = 4

[base]
hp = 4200.0
radius = 90.0
offset_x = 180.0             # 距离各自地图边缘
damage = 140.0               # 基地防御魔晶：保护出生点，防止复活被蹲
range = 400.0
attack_seconds = 1.0

[tower]
hp = 2400.0
radius = 52.0
damage = 85.0
range = 310.0
attack_seconds = 1.2
offset_x = 720.0             # 距离各自地图边缘
lane_offset_y = 470.0        # 上下两座塔距地图中线的偏移

[poison]                     # 魔力辐射毒区
radius = 250.0
dps = 32.0                   # 每秒结算一次
hurts_allies = false         # 只伤害敌方魔法玩偶
hurts_minions = false

[wave]                       # 变异魔兽兵波
interval_seconds = 30
count_per_tower = 3
first_wave_seconds = 2
aggro_range = 220.0          # 发现敌人后脱离流场主动接战
hp = 180.0
damage = 24.0
speed = 95.0
radius = 17.0
range = 45.0
attack_seconds = 1.0
# 波次成长：倍率 = min(1 + 波次 * growth, max_multiplier)
hp_growth = 0.09
damage_growth = 0.07
speed_growth = 0.018
max_multiplier = 3.0
# 可选：显式波次曲线（第 n 项为第 n 波的生命倍率），填写后覆盖 hp_growth。
hp_curve = []

[sudden_death]               # 超时死斗：超级双头变异魔兽
hp = 18000.0
damage = 360.0
speed = 130.0
radius = 55.0
range = 110.0
attack_seconds = 0.8
per_tower = 1                # 每座存活魔法塔孕育的数量（无塔时从基地前出发）
respawn_seconds = 45         # 死斗中被击杀后重新孕育
max_seconds = 240            # 死斗最长时长，超时按基地剩余血量百分比判胜（相同为平局）
base_decay_per_second = 0.0  # 死斗期间基地每秒额外流失（0 关闭）

[hero]
hp = 720.0
speed = 255.0
radius = 24.0
attack_damage = 52.0
attack_range = 270.0
attack_seconds = 0.65
ai_aggro_range = 900.0

# ---- 魔法玩偶与技能 ----
# effect 可选：damage（范围伤害）、stun（范围伤害+眩晕）、slow（范围伤害+减速）、
#             dash（向瞄准方向位移）、heal（范围治疗友方，amount 为最大生命比例）、
#             nova（以自身为中心的范围伤害）
# 每个英雄 3 个技能，依次绑定 Q / E / R。

